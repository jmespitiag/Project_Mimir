[project]
name = 'mimir'
version = '0.5.0'
description = 'Mimir Core - cerebro desacoplado de Google'
requires-python = '>=3.11,<3.13'
dependencies = [
  'fastapi>=0.115',
  'uvicorn[standard]>=0.30',
  'pydantic>=2.7',
  'pydantic-settings>=2.3',
  'sqlalchemy>=2.0',
  'alembic>=1.13',
  'psycopg[binary]>=3.1',
  'google-generativeai>=0.8',
  'google-auth-oauthlib>=1.2',
  'google-api-python-client>=2.0',
  'httpx>=0.27',
]
[dependency-groups]
dev = ['pytest>=8.0', 'httpx>=0.27']
[tool.pytest.ini_options]
testpaths = ['tests']
